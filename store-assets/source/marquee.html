<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Haki — Marquee promo</title><link rel="stylesheet" href="tiles.css"></head>
<body class="marquee">
  <div class="grid" aria-hidden="true"></div>
  <div class="orbit orbit-one" aria-hidden="true"></div><div class="orbit orbit-two" aria-hidden="true"></div>
  <main>
    <div class="brand" role="img" aria-label="Haki"><span class="brand-mark" aria-hidden="true"></span>aki</div>
    <h1>Your rules.<br>Before your<br><em>emotions.</em></h1>
    <p>Willpower before execution.</p>
  </main>
  <div class="symbol" aria-hidden="true">
    <div class="symbol-ring outer"></div><div class="symbol-ring inner"></div>
    <div class="symbol-disc"><img src="brand.svg" alt=""></div>
    <div class="step step-one"><span class="check">✓</span><span class="rule-stroke"></span></div>
    <div class="step step-two"><span class="check">✓</span><span class="rule-stroke"></span></div>
    <div class="step step-three"><span class="check empty"></span><span class="rule-stroke"></span></div>
  </div>
</body></html>
